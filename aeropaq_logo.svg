  <text x="212" y="140" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#1A3C6E" letter-spacing="3" opacity="0.7" style="fill:rgb(26, 60, 110);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Plus Jakarta Sans&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:15px;font-weight:500;text-anchor:start;dominant-baseline:auto">ENVÍOS CONFIABLES</text>

  <!-- Línea decorativa bajo el tagline -->
  <rect x="212" y="152" width="200" height="2" rx="1" fill="#2ECC71" opacity="0.5" style="fill:rgb(46, 204, 113);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Segunda línea opcional -->
  <text x="212" y="180" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="13" fill="#1A3C6E" opacity="0.45" letter-spacing="1" style="fill:rgb(26, 60, 110);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.45;font-family:&quot;Plus Jakarta Sans&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;dominant-baseline:auto">Guatemala · Regional · Internacional</text>
