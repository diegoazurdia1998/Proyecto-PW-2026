  <!-- Nombre AeroPaq -->
  <text x="212" y="108" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="62" font-weight="800" fill="#1A3C6E" letter-spacing="-2" style="fill:rgb(26, 60, 110);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Plus Jakarta Sans&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:62px;font-weight:800;text-anchor:start;dominant-baseline:auto">Aero</text>
  <text x="340" y="108" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="62" font-weight="800" fill="#2ECC71" letter-spacing="-2" style="fill:rgb(46, 204, 113);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Plus Jakarta Sans&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:62px;font-weight:800;text-anchor:start;dominant-baseline:auto">Paq</text>

